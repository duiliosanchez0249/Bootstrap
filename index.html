<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoLux - Venta Premium</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #0f172a;
    color: white;
    font-family: 'Segoe UI', sans-serif;
}

.navbar {
    background: linear-gradient(90deg, #900, #300);
}

.hero {
    background: url("https://images.unsplash.com/photo-1503376780353-7e6692767b70") center/cover no-repeat;
    height: 85vh;
    display: flex;
    align-items: center;
    text-shadow: 0 5px 25px rgba(0,0,0,.7);
}

.car-card {
    transition: .3s ease;
}
.car-card:hover {
    transform: scale(1.05);
    box-shadow: 0 15px 30px rgba(0,0,0,.6);
}

.badge-premium {
    background: #900;
}

footer {
    background: #020617;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark shadow">
  <div class="container">
    <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
       <span class="ms-2">AutoLux</span>
    </a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#autos">Autos</a></li>
        <li class="nav-item"><a class="nav-link" href="#contacto">Contacto</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- HERO -->
<section class="hero text-center">
  <div class="container">
    <h1 class="display-3 fw-bold">Venta Premium de Autos</h1>
    <p class="lead">Potencia, lujo y financiamiento inmediato</p>
    <a href="#autos" class="btn btn-danger btn-lg mt-3">Explorar Catálogo</a>
  </div>
</section>

<!-- AUTOS -->
<section id="autos" class="container py-5">
  <h2 class="text-center mb-4">Catálogo Premium</h2>
  <div class="row g-4" id="catalogo"></div>
</section>

<!-- MODAL -->
<div class="modal fade" id="autoModal">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content bg-dark text-white">
      <div class="modal-header">
        <h5 id="autoTitulo"></h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <img id="autoImagen" class="w-100 rounded mb-3">
        <p id="autoInfo"></p>
        <ul id="autoSpecs"></ul>
      </div>

      <div class="modal-footer">
        <a href="https://instagram.com/its.bert_" target="_blank" class="btn btn-danger fw-bold">
          Solicitar Cotización por Instagram
        </a>
      </div>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer id="contacto" class="text-center py-4 mt-5">
  <p class="fw-bold">AutoLux © 2026 — Autos Premium, Potencia Real</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// AUTOS CON IMÁGENES LOCALES
const autos = [
  {
    nombre: "BMW M4",
    precio: "$1,250,000 MXN",
    imagen: "bmw.jpg",
    info: "503 HP, Twin Turbo, brutal y deportivo.",
    specs: ["0-100 km/h en 3.8s", "Interior premium", "Modo Sport+"]
  },
  {
    nombre: "Audi R8",
    precio: "$2,350,000 MXN",
    imagen: "audi.jpg",
    info: "Motor V10, superdeportivo de lujo.",
    specs: ["Velocidad 330 km/h", "Tracción Quattro", "Diseño agresivo"]
  },
  {
    nombre: "Mercedes AMG",
    precio: "$1,800,000 MXN",
    imagen: "mercedes.jpg",
    info: "Lujo alemán con ADN deportivo.",
    specs: ["Suspensión AMG", "Sonido premium", "Interior full cuero"]
  },
  {
    nombre: "Nissan GTR",
    precio: "$1,950,000 MXN",
    imagen: "gtr.jpg",
    info: "Godzilla japonés, brutal y rápido.",
    specs: ["0-100 km/h en 2.9s", "AWD", "Twin Turbo"]
  },
  {
    nombre: "Ford Mustang",
    precio: "$980,000 MXN",
    imagen: "mustang.jpg",
    info: "Muscle car clásico americano.",
    specs: ["Motor V8", "Escape deportivo", "Diseño agresivo"]
  },
  {
    nombre: "Chevy Pop",
    precio: "$95,000 MXN",
    imagen: "chevy.jpg",
    info: "Económico, confiable y perfecto para ciudad.",
    specs: ["Bajo consumo", "Mantenimiento barato", "Ideal para estudiantes"]
  }
];

// GENERAR CATÁLOGO
const catalogo = document.getElementById("catalogo");

autos.forEach((auto, i) => {
  const card = document.createElement("div");
  card.className = "col-md-4";

  card.innerHTML = `
    <div class="card bg-dark car-card text-white">
      <span class="badge badge-premium position-absolute m-2">Disponible</span>
      <img src="${auto.imagen}" class="card-img-top">
      <div class="card-body">
        <h5>${auto.nombre}</h5>
        <p class="fw-bold">${auto.precio}</p>
        <button class="btn btn-danger w-100" onclick="verAuto(${i})">Ver Detalles</button>
      </div>
    </div>
  `;

  catalogo.appendChild(card);
});

// MODAL DETALLES
function verAuto(index) {
  const auto = autos[index];

  document.getElementById("autoTitulo").innerText = auto.nombre;
  document.getElementById("autoImagen").src = auto.imagen;
  document.getElementById("autoInfo").innerText = auto.info;

  let specsHTML = "";
  auto.specs.forEach(spec => specsHTML += `<li>${spec}</li>`);
  document.getElementById("autoSpecs").innerHTML = specsHTML;

  new bootstrap.Modal(document.getElementById("autoModal")).show();
}
</script>

</body>
</html>
